apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: my-ip-pool
  namespace: markowruck
spec:
  addresses:
  - 192.168.100.0/24
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: my-l2advertisement
  namespace: markowruck
spec:
  ipAddressPools:
  - my-ip-pool
  nodeSelectors:
  - matchLabels:
      kubernetes.io/hostname: msr01
  - matchLabels:
      kubernetes.io/hostname: msr02
  - matchLabels:
      kubernetes.io/hostname: msr03
  - matchLabels:
      kubernetes.io/hostname: wkr01
  - matchLabels:
      kubernetes.io/hostname: wkr02
